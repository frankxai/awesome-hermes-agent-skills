name: Link Checker

on:
  schedule:
    - cron: '0 0 1 * *' # monthly, 1st at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept=200,204,429 --timeout=20 --max-retries=3 --exclude-mail './**/*.md'
          fail: false
          jobSummary: true
          output: ./lychee/out.md

      - name: Find existing broken-link issue
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open \
                --json number --jq 'max_by(.number).number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: Open or update broken-link issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links detected
          content-filepath: ./lychee/out.md
          labels: broken-links
          issue-number: ${{ steps.existing.outputs.number }}
