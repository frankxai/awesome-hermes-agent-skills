name: Link Checker

on:
  pull_request:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --accept=200,204,429
            --timeout=20
            --max-retries=3
            --exclude-mail
            --exclude https://github.com/frankxai/awesome-jarvis
            ./**/*.md
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  monthly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --accept=200,204,429
            --timeout=20
            --max-retries=3
            --exclude-mail
            --exclude https://github.com/frankxai/awesome-jarvis
            ./**/*.md
          fail: false
          jobSummary: true
          output: ./lychee/out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing broken-link issue
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open \
                --json number --jq 'max_by(.number).number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: Open or update broken-link issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
        with:
          title: Broken links detected
          content-filepath: ./lychee/out.md
          labels: broken-links
          issue-number: ${{ steps.existing.outputs.number }}
